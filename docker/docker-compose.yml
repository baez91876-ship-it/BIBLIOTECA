name: libreria

# PostgreSQL se publica solo en localhost para no exponer la base de datos.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: LIBRERIA
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - libreria_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d LIBRERIA"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      # Evita iniciar la API antes de que PostgreSQL acepte conexiones.
      db:
        condition: service_healthy

volumes:
  # Conserva los datos de la biblioteca entre reinicios de los contenedores.
  libreria_data:
    name: libreria_libreria_data
