services:
  - type: web
    name: biblioteca
    runtime: python
    plan: free
    branch: version-2
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m backend.app.scripts.migrate && python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://baez91876-ship-it.github.io
