services:
  - type: web
    name: biblioteca-api-baez91876-ship-it
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: DATABASE_URL
        fromDatabase:
          name: biblioteca-postgres
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://baez91876-ship-it.github.io

databases:
  - name: biblioteca-postgres
    databaseName: libreria
    user: biblioteca
    plan: free
    region: oregon
    postgresMajorVersion: "17"
